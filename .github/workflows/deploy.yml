name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  lint-and-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit

      - name: Frontend checks
        working-directory: client
        run: |
          npm ci
          npx tsc -b --noEmit
          npm run lint

  build-and-deploy:
    name: Build → ECR → Elastic Beanstalk
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        env:
          IMAGE: ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPO_API }}
          SHA:   ${{ github.sha }}
        run: |
          docker build -t "$IMAGE:$SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:latest"

      - name: Build and push client image
        env:
          IMAGE:        ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPO_CLIENT }}
          SHA:          ${{ github.sha }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          docker build --build-arg VITE_API_URL="$VITE_API_URL" \
            -t "$IMAGE:$SHA" -t "$IMAGE:latest" ./client
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:latest"

      - name: Generate Dockerrun.aws.json
        env:
          ECR_REGISTRY:    ${{ secrets.ECR_REGISTRY }}
          ECR_REPO_API:    ${{ secrets.ECR_REPO_API }}
          ECR_REPO_CLIENT: ${{ secrets.ECR_REPO_CLIENT }}
          SHA:             ${{ github.sha }}
          AWS_REGION:      ${{ secrets.AWS_REGION }}
        run: |
          cat > Dockerrun.aws.json <<EOF
          {
            "AWSEBDockerrunVersion": 2,
            "containerDefinitions": [
              {
                "name": "api",
                "image": "${ECR_REGISTRY}/${ECR_REPO_API}:${SHA}",
                "essential": true,
                "memory": 512,
                "portMappings": [{ "hostPort": 8080, "containerPort": 8080 }],
                "environment": [
                  { "name": "NODE_ENV", "value": "production" },
                  { "name": "PORT",     "value": "8080" }
                ],
                "logConfiguration": {
                  "logDriver": "awslogs",
                  "options": {
                    "awslogs-group":         "/aws/elasticbeanstalk/notagen",
                    "awslogs-region":        "${AWS_REGION}",
                    "awslogs-stream-prefix": "api"
                  }
                }
              },
              {
                "name": "client",
                "image": "${ECR_REGISTRY}/${ECR_REPO_CLIENT}:${SHA}",
                "essential": true,
                "memory": 128,
                "portMappings": [{ "hostPort": 80, "containerPort": 80 }],
                "links": ["api"],
                "logConfiguration": {
                  "logDriver": "awslogs",
                  "options": {
                    "awslogs-group":         "/aws/elasticbeanstalk/notagen",
                    "awslogs-region":        "${AWS_REGION}",
                    "awslogs-stream-prefix": "client"
                  }
                }
              }
            ]
          }
          EOF

      - name: Upload bundle to S3 and create app version
        env:
          EB_APP: ${{ secrets.EB_APP_NAME }}
          SHA:    ${{ github.sha }}
        run: |
          zip -r deploy.zip Dockerrun.aws.json .ebextensions/
          BUCKET=$(aws elasticbeanstalk describe-application-versions \
            --application-name "$EB_APP" \
            --query 'ApplicationVersions[0].SourceBundle.S3Bucket' \
            --output text 2>/dev/null || \
            aws s3 ls | awk '{print $3}' | grep elasticbeanstalk | head -1)
          aws s3 cp deploy.zip "s3://${BUCKET}/notagen-${SHA}.zip"
          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APP" \
            --version-label    "notagen-${SHA}" \
            --source-bundle    "S3Bucket=${BUCKET},S3Key=notagen-${SHA}.zip"

      - name: Deploy to Elastic Beanstalk
        env:
          EB_APP: ${{ secrets.EB_APP_NAME }}
          EB_ENV: ${{ secrets.EB_ENV_NAME }}
          SHA:    ${{ github.sha }}
        run: |
          aws elasticbeanstalk update-environment \
            --application-name "$EB_APP" \
            --environment-name "$EB_ENV" \
            --version-label    "notagen-${SHA}"

      - name: Wait for environment to go green
        env:
          EB_ENV: ${{ secrets.EB_ENV_NAME }}
        run: |
          aws elasticbeanstalk wait environment-updated --environment-names "$EB_ENV"
          STATUS=$(aws elasticbeanstalk describe-environments \
            --environment-names "$EB_ENV" \
            --query 'Environments[0].Health' --output text)
          echo "Health: $STATUS"
          [ "$STATUS" = "Green" ] || exit 1
